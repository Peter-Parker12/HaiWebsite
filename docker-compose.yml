services:
  conceptbridge-demo:
    build: .
    image: conceptbridge-demo:latest
    ports:
      - "8392:8392"
    env_file: .env
    environment:
      DATABASE_URL: postgres://conceptbridge:${DB_PASSWORD}@db:5432/conceptbridge
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: conceptbridge
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: conceptbridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conceptbridge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
